trigger:
  branches:
    include: [ main ]

pool:
  vmImage: windows-latest

stages:
- stage: BuildAndTest
  jobs:
  - job: Api
    steps:
    - task: UseDotNet@2
      inputs:
        packageType: sdk
        version: 10.0.x
    - script: dotnet restore LgrTransformationMigration.sln
      displayName: Restore .NET packages
    - script: dotnet build LgrTransformationMigration.sln --configuration Release --no-restore
      displayName: Build API and tests
    - script: dotnet test LgrTransformationMigration.sln --configuration Release --no-build --logger trx
      displayName: Run API tests
    - task: PublishTestResults@2
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: VSTest
        testResultsFiles: '**/*.trx'
  - job: Web
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: 24.x
    - script: npm ci
      workingDirectory: src/web
      displayName: Restore web packages
    - script: npm run lint
      workingDirectory: src/web
      displayName: Lint web
    - script: npm run build
      workingDirectory: src/web
      displayName: Build web
